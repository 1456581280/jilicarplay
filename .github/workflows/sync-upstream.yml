name: Sync upstream

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure sync commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/shihabal3amri/DiPlay.git
          git fetch upstream main
      - name: Merge upstream changes
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f docs/CONNECTION-BASELINE.md ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Stable connection baseline: upstream changes require selective integration."
            exit 0
          fi
          upstream_sha="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits."
            exit 0
          fi
          if git merge-base --is-ancestor HEAD "$upstream_sha"; then
            git merge --ff-only "$upstream_sha"
          else
            git merge --no-edit "$upstream_sha"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push updated main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
      - name: Build after upstream update
        if: steps.merge.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android.yml',
              ref: 'main',
            });
