name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: write
    concurrency:
      group: android-release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check release signing and CarPlay authentication
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MFI_IDENTITY_BASE64: ${{ secrets.DIPLAY_AUTH_IDENTITY_BASE64 }}
          MFI_CERTIFICATE_BASE64: ${{ secrets.DIPLAY_AUTH_CERTIFICATE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" && -n "$MFI_IDENTITY_BASE64" && -n "$MFI_CERTIFICATE_BASE64" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release is not configured. Add the four ANDROID_* signing secrets and DIPLAY_AUTH_IDENTITY_BASE64 plus DIPLAY_AUTH_CERTIFICATE_BASE64 as repository Actions secrets."
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.available == 'true'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.available == 'true'
      - name: Prepare release signing key
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/diplay-release.jks"
      - name: Prepare CarPlay authentication assets
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          MFI_IDENTITY_BASE64: ${{ secrets.DIPLAY_AUTH_IDENTITY_BASE64 }}
          MFI_CERTIFICATE_BASE64: ${{ secrets.DIPLAY_AUTH_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          auth_dir="$RUNNER_TEMP/diplay-auth-assets/offline-mfi"
          mkdir -p "$auth_dir"
          printf '%s' "$MFI_IDENTITY_BASE64" | base64 --decode > "$auth_dir/identity.pk8"
          printf '%s' "$MFI_CERTIFICATE_BASE64" | base64 --decode > "$auth_dir/certificate.p7b"
          test -s "$auth_dir/identity.pk8"
          test -s "$auth_dir/certificate.p7b"
          openssl pkey -inform DER -in "$auth_dir/identity.pk8" -noout -check >/dev/null
          openssl pkcs7 -inform DER -in "$auth_dir/certificate.p7b" -print_certs -noout >/dev/null
          key_fingerprint="$(openssl pkey -inform DER -in "$auth_dir/identity.pk8" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          cert_fingerprint="$(openssl pkcs7 -inform DER -in "$auth_dir/certificate.p7b" -print_certs -outform PEM | openssl x509 -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          if [[ "$key_fingerprint" != "$cert_fingerprint" ]]; then
            echo "::error::CarPlay identity and certificate do not match."
            exit 1
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/diplay-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/diplay-auth-assets
        run: ./gradlew :mobile:assembleRelease --stacktrace
      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diplay-release-apk
          path: mobile/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Read app version
        if: steps.signing.outputs.available == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mobile/build.gradle.kts | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read app version from mobile/build.gradle.kts"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Publish or update GitHub Release
        if: steps.signing.outputs.available == 'true'
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.APP_VERSION;
            const tag = `v${version}`;
            const assetName = `DiPlay-${version}.apk`;
            const releaseNotes = fs.readFileSync(`docs/UPDATE-NOTES-${version}.md`, 'utf8').trim();
            if (!releaseNotes) throw new Error(`Release notes for ${version} are empty`);
            const apkDir = 'mobile/build/outputs/apk/release';
            const apks = fs.readdirSync(apkDir).filter(name => name.endsWith('.apk'));
            if (apks.length !== 1) throw new Error(`Expected one release APK, found ${apks.length}`);
            const apkPath = `${apkDir}/${apks[0]}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `DiPlay ${tag}`,
                body: releaseNotes,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              }));
            }
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              body: releaseNotes,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            for (const asset of release.assets) {
              if (asset.name === assetName) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              data: fs.readFileSync(apkPath),
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': fs.statSync(apkPath).size,
              },
            });
            core.notice(`Published ${assetName} to ${tag}`);
      - name: Remove temporary signing key
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/diplay-release.jks" && rm -rf "$RUNNER_TEMP/diplay-auth-assets"
