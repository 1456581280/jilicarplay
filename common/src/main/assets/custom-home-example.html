<html lang="zh-CN"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>温馨的车联体验</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;padding:clamp(20px,4vw,64px);font:18px/1.5 system-ui,sans-serif;font:clamp(16px,2vw,24px)/1.5 system-ui,sans-serif;color:#fff6ec;background:radial-gradient(ellipse at 90% 90%,#69493e,transparent 55%),linear-gradient(140deg,#15243c,#101925);min-height:100vh}header{margin-bottom:30px}small{color:#ffd0a1;letter-spacing:.15em}h1{font-size:36px;font-size:clamp(28px,5vw,64px);margin:14px 0}p{color:#b9c8e2;margin:12px 0}main{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.card{background:#ffffff0c;border:1px solid #ffffff30;border-radius:24px;padding:24px}a{display:flex;align-items:center;justify-content:center;min-height:56px;padding:14px;margin:12px 0;border:1px solid #ffffff25;border-radius:18px;color:inherit;text-decoration:none;background:#ffffff08;text-align:center;overflow-wrap:anywhere}a:focus-visible{outline:3px solid #ffd0a1}.primary{background:linear-gradient(#ffddbb,#ffc18d);color:#13243b;font-weight:700}h2{font-size:26px;font-size:clamp(22px,3vw,36px);margin:10px 0}footer{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}footer a{flex:1;font-size:16px}@media(max-width:700px){main{grid-template-columns:1fr}.card{padding:18px}body{padding:20px}}
</style></head><body><header><small>你的旅程，更轻松。</small><h1>温馨的车联体验。</h1><p>导航、音乐与通话，<br>在车机屏幕上轻松连接手机。</p></header><main><section class="card"><small>无线连接</small><h2 id="status">准备连接手机</h2><a class="primary" href="diplay://action/connect">立即连接</a><p>保持车机 Wi-Fi、蓝牙和手机 Wi-Fi 开启。</p><a href="diplay://action/choose-device">选择设备</a><a href="diplay://action/disconnect">断开连接</a></section><section class="card"><a href="diplay://action/usb">通过 USB 连接 →</a><p>将手机通过 USB 数据线连接到车机。</p><a href="diplay://action/settings">设置 →</a><p>按需调整车联功能的相关设置。</p></section></main><footer><a href="diplay://action/check-update">检查更新</a></footer><script>function render(s){document.getElementById('status').textContent=s.status}window.addEventListener('diplay-state',function(e){render(e.detail)});if(window.DiPlayState)render(window.DiPlayState);</script></body></html>
